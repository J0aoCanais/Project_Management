<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Account</title>
</head>

<body>
  <p>Signed in as {{ current_user.username }} ({{ current_user.access_level }})</p>
  <form method="post" action="{{ url_for('logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Log out</button>
  </form>
</body>

</html>
